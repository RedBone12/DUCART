name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Checkstyle, tests, coverage, SpotBugs and package
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify
        working-directory: Ducart-Backend
      - name: Upload backend quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          retention-days: 14
          path: |
            Ducart-Backend/target/site/jacoco/
            Ducart-Backend/target/surefire-reports/
            Ducart-Backend/target/checkstyle-result.xml
            Ducart-Backend/target/spotbugsXml.xml

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Ducart-Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: Ducart-Frontend
      - name: ESLint with zero warnings
        run: npm run lint
        working-directory: Ducart-Frontend
      - name: Tests and coverage thresholds
        run: npm run coverage
        working-directory: Ducart-Frontend
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Production build
        run: npm run build
        working-directory: Ducart-Frontend
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path || '/DUCART' }}
          REACT_APP_GITHUB_PAGES: 'true'
          REACT_APP_SERVER: ${{ vars.REACT_APP_SERVER || '/backend-not-configured' }}
      - name: Upload frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Ducart-Frontend/coverage/
          retention-days: 14
      - name: Upload verified Pages build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Ducart-Frontend/build

  deploy:
    name: Deploy frontend
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy the build that passed both quality jobs
        id: deployment
        uses: actions/deploy-pages@v4
