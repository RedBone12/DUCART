name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Checkstyle, tests, coverage, SpotBugs and package
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify
        working-directory: Ducart-Backend
      - name: Upload backend quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          retention-days: 14
          path: |
            Ducart-Backend/target/site/jacoco/
            Ducart-Backend/target/surefire-reports/
            Ducart-Backend/target/checkstyle-result.xml
            Ducart-Backend/target/spotbugsXml.xml

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Ducart-Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: Ducart-Frontend
      - name: ESLint with zero warnings
        run: npm run lint
        working-directory: Ducart-Frontend
      - name: Tests and coverage thresholds
        run: npm run coverage
        working-directory: Ducart-Frontend
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Production build
        run: npm run build
        working-directory: Ducart-Frontend
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path || '/DUCART' }}
          REACT_APP_GITHUB_PAGES: 'true'
          REACT_APP_SERVER: ${{ vars.REACT_APP_SERVER || '/backend-not-configured' }}
      - name: Upload frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Ducart-Frontend/coverage/
          retention-days: 14
      - name: Upload verified Pages build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Ducart-Frontend/build

  mysql:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Real MySQL queries, constraints, JWT purchase flow, locks and rollback
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify -Pmysql-it
        working-directory: Ducart-Backend
      - name: Require a real integration coverage report
        run: test -s target/site/jacoco-it/jacoco.xml
        working-directory: Ducart-Backend
      - name: Upload MySQL integration and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-reports
          retention-days: 14
          path: |
            Ducart-Backend/target/failsafe-reports/
            Ducart-Backend/target/site/jacoco-it/

  browser:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Ducart-Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: Ducart-Frontend
      - name: Verify the runner's installed Chrome
        run: google-chrome --version
      - name: Build the isolated browser-test frontend
        run: npm run e2e:build
        working-directory: Ducart-Frontend
      - name: Chromium purchase, administrator CRUD and access-control journeys
        run: npm run test:e2e
        working-directory: Ducart-Frontend
      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          retention-days: 14
          path: |
            Ducart-Frontend/playwright-report/
            Ducart-Frontend/test-results/

  recovery:
    name: Deployment recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real HTTPS deployment, persisted purchase, backup, fresh-volume restore and failed-release rollback
        run: node scripts/recovery-drill.cjs
      - name: Upload synthetic recovery drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-recovery-report
          path: deploy/drill-results/latest.json
          retention-days: 14

  deploy:
    name: Deploy frontend
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, mysql, browser, recovery]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy the build that passed all five checks
        id: deployment
        uses: actions/deploy-pages@v4
