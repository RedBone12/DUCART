name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Ducart-Frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Ducart-Frontend/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: Ducart-Frontend
      - name: Build frontend
        run: npm run build
        working-directory: Ducart-Frontend
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}
          REACT_APP_GITHUB_PAGES: 'true'
          REACT_APP_SERVER: ${{ vars.REACT_APP_SERVER || '/backend-not-configured' }}
          # Existing lint warnings should not prevent the static site build.
          CI: 'false'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Ducart-Frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
