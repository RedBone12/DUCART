# Production schema changes are versioned; never generate or silently baseline a schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${PUBLIC_ORIGIN}
app.password-reset.frontend-url=${PUBLIC_ORIGIN}/forgot-password
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
# SMTP failure must not make an otherwise usable shop unready.
management.health.mail.enabled=false
