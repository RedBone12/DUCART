spring.application.name=Ducart-Backend

# Local defaults can be overridden by environment variables when the app runs in Docker.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ducart_db1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

logging.level.org.springframework=INFO
logging.level.com.prashant.api.ecom.ducart=INFO

app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktand0LXNlY3JldC1yZXBsYWNlLW1lLWJlZm9yZS1wcm9kdWN0aW9u}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
